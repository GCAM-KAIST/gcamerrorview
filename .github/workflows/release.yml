# Build gcamerrorview for Windows and macOS, and attach both to a GitHub Release.
# Trigger: push a version tag (v1.0.0) - or run it manually from the Actions tab.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install pyinstaller openpyxl pillow
      - name: Build the exe
        run: pyinstaller --onefile --windowed --name gcamerrorview --icon assets/gcamerrorview.ico --add-data "assets/gcamerrorview.ico;assets" --add-data "assets/gcamerrorview.png;assets" --add-data "data/gcam_regions.csv;data" --add-data "data/gcam_systems.csv;data" gcamerrorview.py
      - name: Rename for the release
        run: Copy-Item dist/gcamerrorview.exe gcamerrorview-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gcamerrorview-windows
          path: gcamerrorview-windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          pip install pyinstaller openpyxl delocate
          # The app is built "universal2" (one file for Intel and Apple Silicon Macs), so every
          # compiled library inside it must contain both architectures. Pillow publishes two
          # separate wheels, one per architecture, so download both and merge them into one
          # universal wheel with delocate-merge before installing.
          pip download "pillow==12.3.0" --only-binary=:all: --no-deps --platform macosx_11_0_arm64 -d wheels/arm64
          pip download "pillow==12.3.0" --only-binary=:all: --no-deps --platform macosx_10_13_x86_64 -d wheels/x86_64
          delocate-merge wheels/arm64/*.whl wheels/x86_64/*.whl -w wheels/universal2
          ls wheels/universal2
          pip install wheels/universal2/*.whl
          so="$(python -c 'import PIL._imaging as m; print(m.__file__)')"
          lipo -info "$so"
          test "$(lipo -archs "$so" | wc -w)" -ge 2 || { echo "Pillow is not universal, stopping"; exit 1; }
      - name: Make the Mac icon (.icns) from the png
        run: |
          mkdir gcamerrorview.iconset
          for s in 16 32 64 128 256; do
            sips -z $s $s assets/gcamerrorview.png --out gcamerrorview.iconset/icon_${s}x${s}.png >/dev/null
          done
          cp gcamerrorview.iconset/icon_32x32.png   gcamerrorview.iconset/icon_16x16@2x.png
          cp gcamerrorview.iconset/icon_64x64.png   gcamerrorview.iconset/icon_32x32@2x.png
          cp gcamerrorview.iconset/icon_256x256.png gcamerrorview.iconset/icon_128x128@2x.png
          iconutil -c icns gcamerrorview.iconset -o gcamerrorview.icns
      - name: Build the app (universal - Intel + Apple Silicon)
        run: pyinstaller --onefile --windowed --name gcamerrorview --target-arch universal2 --icon gcamerrorview.icns --add-data "assets/gcamerrorview.png:assets" --add-data "data/gcam_regions.csv:data" --add-data "data/gcam_systems.csv:data" gcamerrorview.py
      - name: Zip the app bundle
        run: cd dist && zip -r ../gcamerrorview-macos.zip gcamerrorview.app
      - uses: actions/upload-artifact@v4
        with:
          name: gcamerrorview-macos
          path: gcamerrorview-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release with both files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gcamerrorview-windows.exe
            gcamerrorview-macos.zip
          generate_release_notes: true
